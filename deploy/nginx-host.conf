# Site config for the nginx ALREADY INSTALLED on the VPS (not a container).
# Install once:
#   sudo cp nginx-host.conf /etc/nginx/sites-available/learnia
#   (replace learnia.example.com and 8080 with your domain / APP_PORT)
#   sudo ln -s /etc/nginx/sites-available/learnia /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d learnia.example.com     # adds HTTPS to this file

server {
    listen 80;
    server_name learnia.tisfoulla.com;

    # Uploads (course assets, AI zip imports) up to 20MB; nginx default is 1MB.
    client_max_body_size 25m;

    location / {
        # The frontend container (published on 127.0.0.1:APP_PORT).
        proxy_pass http://127.0.0.1:5555;

        # Tell the app who the real client is and that the request was https.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
