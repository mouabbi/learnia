# CI/CD for Learnia — one pipeline:
#
#   test-backend ─┐
#                 ├─▶ build-push ─▶ ⏸ your Approve ─▶ deploy
#   test-frontend ┘
#
#   pull request  -> tests only
#   push to main  -> tests -> build + push images -> waits for approval -> deploy
#
# The approval comes from the "production" environment
# (Settings > Environments > production > Required reviewers).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # --------------------------------------------------------------- 1. TEST
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # download the code
      - uses: astral-sh/setup-uv@v5 # install uv
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend

  # ------------------------------------------------------- 2. BUILD + PUSH
  build-push:
    needs: [test-backend, test-frontend] # only if both test jobs passed
    if: github.event_name == 'push' # never for pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag = the commit SHA, so we know exactly which code each image contains.
      - name: Build and push the images
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/learnia-backend:${{ github.sha }} ./backend
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/learnia-frontend:${{ github.sha }} ./frontend
          docker push ${{ vars.DOCKERHUB_USERNAME }}/learnia-backend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/learnia-frontend:${{ github.sha }}

  # --------------------------------------------------- 3. DEPLOY (approved)
  deploy:
    needs: build-push # only if the images were built
    runs-on: ubuntu-latest
    environment:
      name: production # ⏸ the job waits here until you click "Approve"
      url: https://${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy the config files to the VPS
        run: scp deploy/docker-compose.prod.yml deploy/create-admin.sh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/learnia/

      - name: Pull the new images and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/learnia &&
            echo IMAGE_TAG=${{ github.sha }} > .image_tag &&
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image_tag pull &&
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image_tag up -d --remove-orphans
          "

      - name: Check the site is up
        run: |
          sleep 20
          curl --fail https://${{ vars.DOMAIN }}/api/v1/health

      # Only after the health check passed: delete the old learnia-backend /
      # learnia-frontend images (every tag except the one just deployed).
      # Other images on the VPS (postgres, other projects...) are not touched.
      - name: Remove old Learnia images
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            docker images --format '{{.Repository}}:{{.Tag}}' |
              grep -E '/learnia-(backend|frontend):' |
              grep -v ':${{ github.sha }}\$' |
              xargs -r docker rmi || true
          "
