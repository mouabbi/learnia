# CI for Learnia — on every PR to main and every push to main:
#   1. backend: ruff + pytest        2. frontend: eslint + vitest
#   3. build the Docker images (only if 1 and 2 passed)
#   4. on main only: push the images to Docker Hub (tag = commit SHA)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push cancels the older run still going on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The built-in GITHUB_TOKEN can only read the code (least privilege).
permissions:
  contents: read

jobs:
  # Each job runs on its own fresh Ubuntu machine, in parallel unless "needs:".
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend # every "run:" step runs inside backend/
    steps:
      - uses: actions/checkout@v4 # download the repo code

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true # reuse downloaded packages between runs
          cache-dependency-glob: backend/uv.lock

      # Python 3.12 (from .python-version) + exact versions from uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -v

  frontend:
    name: Frontend (eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" = exact versions from package-lock.json (reproducible).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

  # PR: only build (checks the Dockerfiles). Push to main: build + push.
  # Needs in repo Settings > Secrets and variables > Actions:
  #   variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (access token, not password)
  images:
    name: Docker image (${{ matrix.service }})
    needs: [backend, frontend] # skipped if any test job failed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend] # same job, run once per image
    env:
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/learnia-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3 # builder needed for the cache below

      - name: Log in to Docker Hub
        if: github.event_name == 'push' # PRs push nothing, so no login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          # :<sha> = exact version (what the deploy will use); :main = newest, for humans.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          # Reuse Docker layers from earlier runs -> faster builds.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
