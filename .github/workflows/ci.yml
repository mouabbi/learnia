# CI — runs by itself on every push to main and every pull request to main.
# Only checks the code: lint + tests. Building and deploying are in cd.yml
# (manual button).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # download the code
      - uses: astral-sh/setup-uv@v5 # install uv
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
