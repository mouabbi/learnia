# CD — only runs when YOU start it:
#   Actions tab > CD > "Run workflow" > pick the branch + what to do:
#     build             build the 2 images and push them to Docker Hub
#     deploy            deploy images that already exist on Docker Hub
#     build-and-deploy  both, one after the other
# (In a private repo only people with write access can click the button,
#  so the click is the approval.)
name: CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build-and-deploy, build, deploy]
        default: build-and-deploy
      image_tag:
        description: "Deploy only: commit SHA to deploy (empty = the commit of the selected branch). Use an old SHA to roll back."
        required: false

jobs:
  # ----------------------------------------------------------- BUILD + PUSH
  build-push:
    if: inputs.action != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same commands you would type on your PC.
      # Tag = the commit SHA, so we know exactly which code each image contains.
      - name: Build and push the images
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/learnia-backend:${{ github.sha }} ./backend
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/learnia-frontend:${{ github.sha }} ./frontend
          docker push ${{ vars.DOCKERHUB_USERNAME }}/learnia-backend:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/learnia-frontend:${{ github.sha }}

  # ----------------------------------------------------------------- DEPLOY
  deploy:
    needs: build-push
    # always() = still run when build-push was SKIPPED ("deploy" only);
    # but never after a failed build, and only from the main branch.
    if: >-
      always()
      && inputs.action != 'build'
      && github.ref == 'refs/heads/main'
      && (needs.build-push.result == 'success' || needs.build-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production # groups the deploy history under "Environments"
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy the config files to the VPS
        run: scp deploy/docker-compose.prod.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/learnia/

      - name: Pull the images and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/learnia &&
            echo IMAGE_TAG=$IMAGE_TAG > .image_tag &&
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image_tag pull &&
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .image_tag up -d
          "

      - name: Check the site is up
        run: |
          sleep 20
          curl --fail https://${{ vars.DOMAIN }}/api/v1/health
