# nginx config for the Learnia frontend container.
# One address for the browser (http://localhost:8080):
#   /api/...   -> forwarded to the backend container
#   everything else -> the built React app

# Behind Caddy (production) the original scheme is https and arrives in
# X-Forwarded-Proto — keep it. Locally (no proxy in front) fall back to
# nginx's own scheme (http).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (course assets, AI zip imports) can be up to 20MB.
    # nginx's default is only 1MB -> "413 Request Entity Too Large".
    client_max_body_size 25m;

    # --- API: reverse proxy to the backend ---------------------------------
    # "backend" is the SERVICE NAME from docker-compose.yml. Docker's
    # built-in DNS turns it into the backend container's IP on the shared
    # network — no IP addresses hard-coded anywhere.
    location /api/ {
        proxy_pass http://backend:8000;

        # Tell the backend who the real client is (not nginx).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # AI zip imports / big prompts can take a few seconds.
        proxy_read_timeout 120s;
    }

    # --- Built JS/CSS: file names contain a hash, so cache them "forever" --
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- React Router (single-page app) --------------------------------------
    # /cms/docker-basics is not a real file: send index.html and let React
    # decide what to show. Without this, refreshing any page gives a 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached, or users keep an old app version.
        add_header Cache-Control "no-cache";
    }
}
